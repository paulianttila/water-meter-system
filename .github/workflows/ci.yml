name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Static analysis (Ruff, Black, Bandit)
        run: ./run_tests.sh -s

      - name: Run unit and integration tests
        run: |
          sudo cp -R config /
          sudo mkdir -p /image_tmp
          sudo chmod -R 777 /config /image_tmp
          ./run_tests.sh -a
