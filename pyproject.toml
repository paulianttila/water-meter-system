[project]
name = "water-meter-system"
version = "1.0.0"
description = "Automatic utility meter digitizer using neural network inference"
readme = "README.md"
requires-python = ">=3.9, <3.12"
dependencies = [
    "fastapi>=0.109.2",
    "jinja2>=3.1.4",
    "nicegui>=1.4.25",
    "numpy>=1.26.4,<2.0.0",
    "opencv-python>=4.9.0.80",
    "pillow>=10.2.0",
    "requests>=2.31.0",
    "tflite-runtime>=2.5.0",
    "uvicorn>=0.29.0",
]

[tool.uv]
find-links = ["wheels"]

[tool.uv.sources]
tflite-runtime = [
    { path = "wheels/tflite_runtime-2.5.0.post1-cp39-cp39-macosx_12_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7.7",
    "black>=24.2.0",
    "coverage>=7.4.3",
    "pytest>=7.2.2,<8.0.0",
    "ruff>=0.2.2",
    "tavern>=2.10.1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7.7",
    "black>=24.2.0",
    "coverage>=7.4.3",
    "pytest>=7.2.2,<8.0.0",
    "ruff>=0.2.2",
    "tavern>=2.10.1",
]

[tool.black]
line-length = 88
target-version = ["py39", "py311"]

[tool.ruff]
# Same as Black.
line-length = 88

# Assume Python 3.9.
target-version = "py39"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.bandit]
exclude_dirs = ["tests", ".venv", "dist", "build", "setup.py"]
skips = []

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]
