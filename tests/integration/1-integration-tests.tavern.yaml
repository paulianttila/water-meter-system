---

test_name: Make sure app works

includes:
  - !include variables.yaml

stages:
  - name: test index.html
    request:
      url: 'http://{url}/'
      method: GET
      timeout: 3
    response:
      status_code: 200
      headers:
        content-type: text/html; charset=utf-8

  - name: test version
    request:
      url: 'http://{url}/version'
      method: GET
      timeout: 3
    response:
      status_code: 200
      headers:
        content-type: application/json

  - name: test healthy check OK
    request:
      url: 'http://{url}/healthcheck'
      method: GET
      timeout: 3
    response:
      status_code: 200
      headers:
        content-type: text/html; charset=utf-8

  - name: test meters in HTML format
    request:
      url: 'http://{url}/meter'
      method: GET
      timeout: 3
    response:
      status_code: 200
      headers:
        content-type: text/html; charset=utf-8

  - name: test roi
    request:
      url: 'http://{url}/roi'
      method: GET
      timeout: 3
    response:
      status_code: 200
      headers:
        content-type: text/html; charset=utf-8
      verify_response_with:
        function: testing_utils:check_roi_image

  # This test need to be the last one, because it will save the images, which will be used in the next test
  - name: test meters in JSON format
    request:
      url: 'http://{url}/meter?format=json&saveimages=true'
      method: GET
      timeout: 3
    response:
      status_code: 200
      headers:
        content-type: application/json
      json:
        meters:
          - name: digital
            value: "00452"
            unit: ""
          - name: analog
            value: "91241"
            unit: ""
          - name: total
            value: "00452.91241"
            unit: ""
        digital_results:
          digit1: "0.0"
          digit2: "0.0"
          digit3: "4.0"
          digit4: "4.9"
          digit5: "2.6"
        analog_results:
          analog1: "0.00"
          analog2: "0.90"
          analog3: "2.50"
          analog4: "4.10"
        error: ""
